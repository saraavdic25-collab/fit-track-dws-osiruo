version: '3.9'

services:
  # Backend - json-server
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fit-tracer-backend
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - CORS_ORIGIN=${FRONTEND_URL:-http://localhost:80}
    volumes:
      - db-volume:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/users"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - fit-tracer-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Frontend - React aplikacija
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: fit-tracer-frontend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    environment:
      - REACT_APP_API_URL=${API_URL:-http://localhost:3000}
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - fit-tracer-network
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# Named volume za persistence baze podataka
volumes:
  db-volume:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./backend/data

# Mrežna konekcija između servisa
networks:
  fit-tracer-network:
    driver: bridge
